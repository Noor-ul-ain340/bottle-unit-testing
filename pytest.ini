[pytest]
# bottle.py repo ke root me hai, isliye "import bottle" directly kaam karta hai
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers

markers =
    laiba_tests: Laiba ke test cases (BaseResponse + Router)
    noor_tests: Noor ke test cases (HeaderDict + SimpleTemplate)
    smoke: Sanity check tests (sab se pehle chalte hain)
    ecp: Equivalence Class Partitioning based tests
    bva: Boundary Value Analysis based tests
    csv_driven: Tests jo external CSV file se data parh kar chalte hain
    response: BaseResponse module ke tests
    router: Router module ke tests
    headers: HeaderDict module ke tests
    template: SimpleTemplate module ke tests
